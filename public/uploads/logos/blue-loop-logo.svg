<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">EduStreamix Loop Logo</title>
  <desc id="desc">A blue oval mark with a grey loop symbol and two blue openings.</desc>
  <defs>
    <pattern id="stripePattern" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#d8d6ce"/>
      <rect width="2.7" height="7" fill="#7f7e78" opacity=".72"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="4" flood-color="#202018" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="360" height="240" fill="#ffffff"/>
  <ellipse cx="180" cy="120" rx="166" ry="98" fill="#073b94"/>
  <g filter="url(#softShadow)" transform="translate(0 3)">
    <ellipse cx="135" cy="123" rx="58" ry="78" fill="#2c2c27"/>
    <ellipse cx="225" cy="123" rx="58" ry="78" fill="#2c2c27"/>
  </g>
  <ellipse cx="135" cy="117" rx="57" ry="78" fill="url(#stripePattern)"/>
  <ellipse cx="225" cy="117" rx="57" ry="78" fill="url(#stripePattern)"/>
  <ellipse cx="135" cy="123" rx="31" ry="32" fill="#073b94"/>
  <ellipse cx="225" cy="123" rx="31" ry="32" fill="#073b94"/>
</svg>
